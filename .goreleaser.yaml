version: 2
project_name: apple-compose
builds:
  - main: ./cmd/apple-compose
    binary: apple-compose
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^ci:"]
release:
  draft: false
  prerelease: auto
