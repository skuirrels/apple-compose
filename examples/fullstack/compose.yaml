name: fullstack
services:
  api:
    build:
      context: ./app
      args:
        BANNER: ${BANNER:-compose}
    environment:
      PEER: db
    ports:
      - "127.0.0.1:18100:8000"
    secrets:
      - api_token
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null"]
      interval: 3s
      start_period: 5s
  db:
    image: alpine:3.20
    command: sh -c "while true; do sleep 1; done"
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
    networks: [backend]
    volumes:
      - shared:/shared
  debug:
    image: alpine:3.20
    command: sh -c "while true; do sleep 1; done"
    profiles: [debug]
    networks: [frontend]
    volumes:
      - shared:/shared
networks:
  frontend: {}
  backend:
    internal: true
volumes:
  shared:
    x-apple-compose:
      shared: true
secrets:
  api_token:
    environment: API_TOKEN
